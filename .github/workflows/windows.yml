name: Published v1.3.1 UI verification
on: workflow_dispatch
permissions:
  contents: write
jobs:
  published-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the published portable and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download v1.3.1 --repo kkodamalab/presentation-frame-timer --pattern Presentation-Frame-Timer-Portable.exe --pattern SHA256SUMS.txt --dir release
      - run: node tests/published-ui.mjs
      - name: Attach visible preview evidence to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.3.1 --repo kkodamalab/presentation-frame-timer test-results/desktop-portable-v131-all-settings.png test-results/desktop-portable-v131-all-settings-full.png test-results/desktop-portable-v131-custom-time.png test-results/desktop-portable-v131-custom-time-full.png test-results/desktop-portable-v131-overlay-time.png test-results/desktop-portable-v131-published-proof.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-ui-evidence
          path: test-results/desktop-portable-v131-*
