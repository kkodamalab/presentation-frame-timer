name: Packaged v1.3.2 startup investigation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  packaged:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:install
      - run: npm run desktop:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node tests/packaged-startup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-investigation
          path: |
            release/*.exe
            test-results/desktop-*
