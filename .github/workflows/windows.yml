name: Investigate published v1.3.1 startup
on: workflow_dispatch
permissions:
  contents: read
jobs:
  investigate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download old public exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download v1.3.1 --repo kkodamalab/presentation-frame-timer --pattern Presentation-Frame-Timer-Portable.exe --dir release
      - run: node tests/reproduce-v131.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v131-investigation
          path: test-results/desktop-v131-*
