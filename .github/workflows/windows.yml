name: Verify published v1.3.2 startup
on: workflow_dispatch
permissions:
  contents: write
jobs:
  published-startup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download public installers and verify checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          gh release download v1.3.2 --repo kkodamalab/presentation-frame-timer --pattern '*.exe' --pattern SHA256SUMS.txt --pattern PACKAGE-MANIFEST.json --dir release
          node -e "const fs=require('fs'),c=require('crypto');for(const line of fs.readFileSync('release/SHA256SUMS.txt','utf8').trim().split(/\r?\n/)){const [hash,file]=line.trim().split(/\s+/);if(c.createHash('sha256').update(fs.readFileSync('release/'+file)).digest('hex')!==hash)throw Error('Checksum mismatch: '+file)}"
      - run: node tests/packaged-startup.mjs
      - name: Install the public Setup and verify startup
        run: |
          $dir=Join-Path $env:RUNNER_TEMP 'FrameTimerPublic'
          $p=Start-Process 'release/Presentation-Frame-Timer-Setup.exe' -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'Public installer failed'}
          $env:ELECTRON_EXECUTABLE=Join-Path $dir 'Presentation Frame Timer.exe'
          node tests/packaged-startup.mjs
          if($LASTEXITCODE -ne 0){throw 'Public Setup startup test failed'}
      - name: Mark proofs as public downloads and attach evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const fs=require('fs'),c=require('crypto');for(const kind of ['portable','installed']){const file='test-results/desktop-'+kind+'-v132-startup-proof.json';const r=JSON.parse(fs.readFileSync(file));r.downloadedPublishedExe=true;r.publicPortableSHA256=c.createHash('sha256').update(fs.readFileSync('release/Presentation-Frame-Timer-Portable.exe')).digest('hex');r.publicSetupSHA256=c.createHash('sha256').update(fs.readFileSync('release/Presentation-Frame-Timer-Setup.exe')).digest('hex');fs.writeFileSync(file,JSON.stringify(r,null,2));}"
          $assets=@(Get-ChildItem 'test-results/desktop-*-v132-startup-*' -File | ForEach-Object FullName)
          gh release upload v1.3.2 --repo kkodamalab/presentation-frame-timer @assets --clobber
          if($LASTEXITCODE -ne 0){throw 'Evidence upload failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-startup-evidence
          path: test-results/desktop-*-v132-startup-*
