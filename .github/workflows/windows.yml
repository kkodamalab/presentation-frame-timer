name: Windows desktop
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:install
      - run: npm test
      - run: npm run build
      - run: npm run test:electron
      - run: npm run test:audio:electron
      - run: node tests/duration-electron.mjs
      - run: node tests/windows-overlay.mjs
      - name: Document PiP in Windows Chrome and Edge
        shell: pwsh
        env:
          PIP_NATIVE_CHECK: '1'
        run: |
          $server = Start-Process node -ArgumentList 'server.mjs' -PassThru
          try {
            foreach ($channel in @('chrome', 'msedge')) {
              $env:PIP_CHANNEL = $channel
              npm run test:pip
              if ($LASTEXITCODE -ne 0) { throw "Document PiP failed in $channel" }
              node tests/v130-browser.mjs
              if ($LASTEXITCODE -ne 0) { throw "v1.3.0 duration/pixel checks failed in $channel" }
              npm run test:audio:web
              if ($LASTEXITCODE -ne 0) { throw "Web audio failed in $channel" }
            }
          } finally {
            Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          }
      - run: npm run desktop:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/inspect-package.mjs
      - run: node tests/portable-windows.mjs
      - name: Install and validate packaged application
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'FrameTimerInstalled'
          $setup = Start-Process -FilePath 'release/Presentation-Frame-Timer-Setup.exe' -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $env:ELECTRON_EXECUTABLE = Join-Path $installDir 'Presentation Frame Timer.exe'
          if (!(Test-Path $env:ELECTRON_EXECUTABLE)) { throw 'Installed executable missing' }
          npm run test:electron
          if ($LASTEXITCODE -ne 0) { throw 'Installed application checks failed' }
          $uninstall = Join-Path $installDir 'Uninstall Presentation Frame Timer.exe'
          if (!(Test-Path $uninstall)) { throw 'Uninstaller missing' }
          $process = Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstaller failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.blockmap
            release/PACKAGE-MANIFEST.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence
          path: |
            test-results/desktop-*
            test-results/pip-*
            test-results/audio-*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: installers
      - name: Include audio attribution and checksums
        run: |
          cp audio/ATTRIBUTION.md installers/AUDIO-CREDITS.md
          cd installers
          sha256sum *.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
