<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>Frame Timer — 操作</title><link rel="stylesheet" href="control.css"></head><body><h1>FRAME TIMER</h1><output id="remaining">10:00</output><p id="status" role="status">待機中</p><form id="duration-form"><label>発表時間（秒、1〜7200）<input id="duration" type="number" min="1" max="7200" value="600" required></label><button>時間を設定・リセット</button></form><div class="actions"><button data-action="start">START</button><button data-action="pause">PAUSE</button><button data-action="resume">RESUME</button><button data-action="reset">RESET</button></div><label>投影先モニター<select id="display"></select></label><label>配色<select id="mode"><option value="gradient">グラデーション</option><option value="solid">単色固定</option></select></label><div class="colors"><label>開始色<input id="start" type="color" value="#4385ff"></label><label>終了色<input id="end" type="color" value="#f45b65"></label><label>単色<input id="solid" type="color" value="#4385ff"></label></div><label>ゲージ太さ（3〜40px）<input id="thickness" type="range" min="3" max="40" value="6"></label><label>ゲージ透明度（不透明度5〜100%）<input id="opacity" type="range" min="5" max="100" value="90"></label><label class="check"><input id="showTime" type="checkbox" checked>残り時間を表示</label><label class="check"><input id="visible" type="checkbox" checked>オーバーレイを表示</label><label class="check"><input id="blink" type="checkbox">終了時に点滅（約4秒）</label><label class="check"><input id="sound" type="checkbox">終了時に効果音</label><p id="error" role="alert"></p><p class="help">閉じると操作パネルだけを隠し、タイマーは継続します。トレイのアイコンから再表示・終了できます。複数画面では操作パネルを投影先以外に移動します。単一画面・複製表示ではSTART後に閉じてください。</p><script type="module" src="control.js"></script></body></html>
